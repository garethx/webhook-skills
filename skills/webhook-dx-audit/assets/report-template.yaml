# Webhook DX Audit template.
#
# Fill in the placeholder values for each new audit and lint the result with:
#
#   cd skills/webhook-dx-audit && npm run lint:file -- <path-to-audit.yaml>
#
# Authoritative references:
#   - schema/audit.schema.yaml   - field shape; locks CategoryId and CriterionId enums
#   - schema/README.md           - status taxonomy and dual-score handling
#   - references/rubric.md       - 12 categories, every criterion, 0/1/2 anchors
#   - references/methodology.md  - how to find evidence; writing tactics
#   - references/scoring.md      - category weights and grade-band math
#
# Style:
#   - snake_case field names; block YAML for objects; multi-line prose in `|` block scalars.
#   - Strings marked `TBD` are placeholders an auditor MUST replace; leaving any in a real
#     audit is a sign the audit is incomplete.
#   - Optional fields are commented out; uncomment and fill when relevant.

audit:

  # ----------------------------------------------------------------------------
  # Header
  # ----------------------------------------------------------------------------

  # Platform under audit.
  platform: TBD

  # Date the audit was prepared (ISO 8601).
  prepared: 2026-01-01

  # OPTIONAL one-line context (e.g. "Existing Hookdeck Outpost customer.").
  # Drop the key entirely if not relevant.
  # context: TBD

  access:
    # L0 public docs only, L1 logged-in account, L2 active usage with deliveries
    # observed. See rubric.md "Access level requirements: source of truth for
    # Not Assessed".
    level: L0
    notes: TBD

  audience:
    # developer-platform | no-code-saas | mixed. Drives Table 2 of the N/A
    # logic in rubric.md. Verify against the homepage; never default away
    # without reason (developer-platform is a Pass-1 fallback only when the
    # homepage cannot be fetched). See methodology.md step 0.
    designation: developer-platform
    # At least three signals supporting the designation, each with a verbatim
    # quote from the source. Tiers: primary | secondary | tertiary.
    signals:
      - tier: primary
        segment: TBD
        evidence_quote: TBD
        source_section: TBD
      - tier: secondary
        segment: TBD
        evidence_quote: TBD
        source_section: TBD
      - tier: tertiary
        segment: TBD
        evidence_quote: TBD
        source_section: TBD

  reviewer:
    # Skill that produced the audit; match the SKILL.md frontmatter version.
    skill: webhook-dx-audit
    skill_version: "0.2.0"
    # OPTIONAL. Humans who participated in any pass (HITL Pass 2 is typical).
    # human_reviewers:
    #   - name: TBD
    #     passes: [pass-2]

  passes:
    # The unattended research pass is always present.
    pass_1:
      mode: unattended
      completed: 2026-01-01
    # OPTIONAL. Uncomment when an HITL pass ran. `closed_criteria` lists the
    # criterion IDs Pass 2 lifted from Not Assessed (or revised based on
    # observed evidence).
    # pass_2:
    #   mode: hitl
    #   completed: 2026-01-01
    #   closed_criteria: []
    #   notes: TBD

  # ----------------------------------------------------------------------------
  # Grade
  # ----------------------------------------------------------------------------

  grade:
    # Headline percentage and band per scoring.md. For Pass-1-only audits this
    # is the Public-scope grade unless the audit explicitly leads with the
    # Provisional minimum.
    overall_pct: 0
    band: F
    # OPTIONAL dual-score detail. Populate when the run produced distinct
    # Public-scope and Provisional-minimum numbers (Pass-1-only). When HITL
    # Pass 2 has closed every Not Assessed criterion the two converge; drop
    # these sub-objects.
    # public_scope:
    #   pct: 0
    #   band: F
    # provisional_minimum:
    #   pct: 0
    #   band: F
    # hitl_headroom_pct: 0
    coverage:
      criteria_total: 0
      scored: 0
      not_applicable: 0
      not_assessed: 0

  # ----------------------------------------------------------------------------
  # Summary
  #
  # Multi-line block scalar. Developer-to-developer voice; no marketing
  # language; American English. See methodology.md Tactics:
  #   - "Scope the summary to webhook-surface features." Only list features
  #     that contribute to the webhook and event-destination surface. An
  #     OpenAPI spec without a `webhooks` block, an MCP server without
  #     webhook tools, or a CLI that does not manage webhook config belongs
  #     in its category findings, not in the summary.
  #   - "Stay factual; no editorial." No company-stage commentary; no
  #     unanchored qualifiers ("unusually", "remarkably", "solid",
  #     "impressive", "painful", etc.).
  # ----------------------------------------------------------------------------

  summary: |
    TBD

  # ----------------------------------------------------------------------------
  # Scorecard - per-category summary
  #
  # One entry per category, in rubric order. `score_pct` for the single
  # converged value; add `public_scope_pct` and `provisional_min_pct` when
  # dual-scoring. `weight` matches scoring.md and sums to 100 across the 12
  # categories.
  # ----------------------------------------------------------------------------

  scorecard:
    - id: discovery-and-signup
      name: Discovery & signup
      score_pct: 0
      weight: 4
      note: TBD

