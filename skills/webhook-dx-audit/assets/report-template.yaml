  # ----------------------------------------------------------------------------
  # Recommendations - ranked by impact x ease
  #
  # IDs are positive integers unique within the audit. `why` and `body` are
  # multi-line block scalars; Markdown is fine. `categories_addressed` must
  # include at least one CategoryId.
  #
  # `why` is load-bearing: it names the integrator-side benefit of adopting
  # the recommendation - the reason the operator should care. Cite the
  # user-facing pain the gap creates. `body` is what to change. See
  # methodology.md "Writing recommendations".
  #
  # `target_scores` lists per-criterion target scores: which criteria this
  # recommendation would lift to which 0/1/2 score if implemented. Used to
  # compute the projected scorecard (current vs potential). Be honest with
  # the target: documenting an existing single auth option reaches 1, not
  # 2 (the 2-anchor requires multiple documented options).
  #
  # `depends_on` lists other recommendation IDs that must land before this
  # one delivers full value (hard dependencies only).
  #
  # `effort` is a coarse implementation indicator: docs | s | m | l. See
  # the EffortLevel enum in schema/audit.schema.yaml for calibration.
  # ----------------------------------------------------------------------------

