  # `score: null` and explain in `status_reason`).
  #
  # status enum:
  #   - scored          : a 0/1/2 score with no special label
  #   - not_supported   : 0 with "capability should exist but doesn't" intent
  #   - not_applicable  : dropped from math via Table 1 or Table 2 of rubric.md
  #   - not_assessed    : could not reach at the declared access level
  #
  # Evidence is multi-line (|). Quote the doc page, name the API field, or
  # reference the in-product capture. Apply methodology.md Tactics' editorial
  # rules: no editorial qualifiers, no company-stage commentary, observation
  # not reaction.
  #
  # cross_refs is optional; populate when a criterion's gap is closed by a
  # recommendation or relates to another category's score.
  #
  # recommendations_addressing lists the recommendation IDs that address gaps
  # in this category (omit when no recommendations apply).
  # ----------------------------------------------------------------------------

